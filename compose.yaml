services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: openbracket
      POSTGRES_PASSWORD: openbracket
      POSTGRES_DB: openbracket
    ports: ["127.0.0.1:${POSTGRES_PORT:-55432}:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openbracket -d openbracket"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    init: true
    ports: ["127.0.0.1:3000:3000"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://openbracket:openbracket@db:5432/openbracket?schema=public
      AUTH_URL: http://localhost:3000
      AUTH_TRUST_HOST: "true"
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
volumes:
  postgres-data:
