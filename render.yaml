# Hosting activation is intentionally deferred. Apply this Blueprint after connecting Render.
# Free PostgreSQL instances may expire; choose a durable plan before relying on demo data.
services:
  - type: web
    name: openbracket-staging
    runtime: docker
    plan: free
    branch: develop
    autoDeployTrigger: off
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          { name: openbracket-staging-db, property: connectionString }
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: AUTH_URL
        sync: false
      - key: DEMO_AUTH_ENABLED
        value: "true"
  - type: web
    name: openbracket-production
    runtime: docker
    plan: free
    branch: main
    autoDeployTrigger: off
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          { name: openbracket-production-db, property: connectionString }
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: AUTH_URL
        sync: false
      - key: DEMO_AUTH_ENABLED
        value: "true"
databases:
  - name: openbracket-staging-db
    plan: free
    databaseName: openbracket_staging
  - name: openbracket-production-db
    plan: free
    databaseName: openbracket_production
