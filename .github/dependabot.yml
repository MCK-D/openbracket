version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    target-branch: develop
    groups:
      development: { dependency-type: development }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    target-branch: develop
  - package-ecosystem: gradle
    directory: /mobile
    schedule: { interval: weekly }
    target-branch: develop
