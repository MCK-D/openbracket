name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  TAG: ${{ github.ref_name }}
  PRODUCTION_ORIGIN: https://openbracket-mck-d.vercel.app
  HUSKY: "0"
jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - name: Require a reviewed commit on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::$TAG must point to a commit merged into main."; exit 1; }
      - name: Require a successful CI run for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CONCLUSION=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?check_name=CI%20passed" \
            --jq '[.check_runs[] | select(.conclusion == "success")] | length')
          [ "$CONCLUSION" -gt 0 ] || { echo "::error::CI passed has not succeeded on $GITHUB_SHA."; exit 1; }
      - name: Check versions and extract release notes
        run: npx tsx scripts/prepare-release.ts "$TAG" release-notes.md
      - uses: actions/upload-artifact@v4
        with: { name: release-notes, path: release-notes.md, retention-days: 7 }
  android:
    name: Android release APK
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build the APK against production
        working-directory: mobile
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug -PapiBaseUrl="$PRODUCTION_ORIGIN"
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk "../dist/openbracket-$TAG.apk"
      - uses: actions/upload-artifact@v4
        with:
          {
            name: release-apk,
            path: dist/,
            if-no-files-found: error,
            retention-days: 7,
          }
  publish:
    name: Publish GitHub release
    needs: [verify, android]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: release-notes }
      - uses: actions/download-artifact@v4
        with: { name: release-apk, path: dist }
      - name: Create the release with checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum "openbracket-$TAG.apk" > SHA256SUMS
          {
            cat ../release-notes.md
            printf '\n## Artifacts\n\n'
            printf -- '- `openbracket-%s.apk`: native Android client, debug-signed, API origin %s.\n' "$TAG" "$PRODUCTION_ORIGIN"
            printf -- '- `SHA256SUMS`: checksum of the APK.\n'
            printf -- '- Source: commit `%s`.\n' "$GITHUB_SHA"
            printf '\nReproduce, deploy and roll back this release with [docs/releases.md](https://github.com/%s/blob/%s/docs/releases.md).\n' "$GITHUB_REPOSITORY" "$TAG"
          } > ../release-body.md
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "OpenBracket $TAG" --notes-file ../release-body.md \
            "openbracket-$TAG.apk" SHA256SUMS
